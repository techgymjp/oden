<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>おでんつんつん</title>
  <meta name="description" content="見た目では煮え具合がわからない！串でツンツンして、煮えたおでんをお客さんに出そう。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="hud-item"><span class="hud-label" data-i18n="sales">売上</span><span id="score" class="hud-value">¥0</span></div>
      <div class="hud-item"><span class="hud-label" data-i18n="time">のこり</span><span id="time" class="hud-value">--</span></div>
      <div class="hud-item"><span class="hud-label" data-i18n="rep">評判</span><span id="hearts" class="hud-value hearts"></span></div>
      <button id="pause" class="icon-btn" type="button" aria-label="一時停止" data-i18n-aria="pauseAria">⏸</button>
      <button id="mute" class="icon-btn" type="button" aria-label="音のオン・オフ" data-i18n-aria="mute">🔊</button>
    </header>

    <section class="counter" aria-label="お客さん" data-i18n-aria="counter">
      <div id="seats" class="seats"></div>
    </section>

    <div id="toast" class="toast" aria-live="polite"></div>

    <section class="pot-wrap" aria-label="おでん鍋" data-i18n-aria="potAria">
      <div class="pot-box">
        <div id="pot" class="pot"></div>
        <div id="full" class="full-banner" role="status" data-i18n="full">鍋が満杯！ 注文を受けられません</div>
      </div>
      <p class="pot-hint" data-i18n="hint">ツンツンできるのは真ん中の一番上の具だけ。下の段の具は隙間から見えます。煮え具合は見た目ではわかりません。</p>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <button class="icon-btn lang-btn panel-lang" type="button" data-lang-toggle>EN</button>
      <h1 class="title" data-i18n="title">おでん<span>つんつん</span></h1>
      <div id="panel-body"></div>
      <div id="panel-actions" class="panel-actions"></div>
    </div>
  </div>

  <script src="build-info.js"></script>
  <script src="ads-config.js"></script>
  <script src="ads.js"></script>
  <script src="game.js"></script>
</body>
</html>
